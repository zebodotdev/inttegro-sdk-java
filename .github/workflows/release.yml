name: Release

permissions: read-all

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'zebodotdev/inttegro-sdk-java'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    env:
      INTTEGRO_OPENAPI_SPEC: openapi/commerce.yml
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the OpenAPI contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zebodotdev/openapi
          ref: d8e3b5ab2ac0d24d9edb4a24fdad7b9815cc803b
          path: openapi
          persist-credentials: false

      - name: Set up Java, Maven Central, and GPG
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase-env-var: MAVEN_GPG_PASSPHRASE

      - name: Verify the release tag and Maven version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(mvn --batch-mode help:evaluate -Dexpression=project.version -q -DforceStdout)"
          test "${GITHUB_REF_NAME}" = "v${package_version}"
          test "$(git rev-list -n 1 "${GITHUB_REF_NAME}")" = "${GITHUB_SHA}"

      - name: Run the release tests
        run: mvn --batch-mode test

      - name: Build, sign, and publish the exact Maven artifacts
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          source_date_epoch="$(git show -s --format=%ct "${GITHUB_SHA}")"
          mvn --batch-mode -Prelease -DskipTests \
            -Dproject.build.outputTimestamp="${source_date_epoch}" \
            deploy

      - name: Collect the published Maven artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          staging_dir="target/central-staging/com/inttegro/inttegro-sdk-java/${version}"
          test -d "${staging_dir}"
          mkdir -p artifacts
          cp "${staging_dir}"/* artifacts/
          cp target/central-publishing/central-bundle.zip artifacts/
          test "$(find artifacts -maxdepth 1 -name '*.jar' | wc -l | tr -d ' ')" = "3"
          test "$(find artifacts -maxdepth 1 -name '*.asc' | wc -l | tr -d ' ')" -ge "4"

      - name: Attest the Maven publication bundle
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/*.jar
            artifacts/*.pom
            artifacts/central-bundle.zip

      - name: Record release provenance and checksums
        shell: bash
        run: |
          set -euo pipefail
          cp "${{ steps.attest.outputs.bundle-path }}" artifacts/ATTESTATION.sigstore.jsonl
          {
            echo "repository=https://github.com/${GITHUB_REPOSITORY}"
            echo "tag=${GITHUB_REF_NAME}"
            echo "commit=${GITHUB_SHA}"
            echo "workflow=${GITHUB_WORKFLOW_REF}"
          } > artifacts/PROVENANCE.txt
          (
            cd artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Publish the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" artifacts/*
          --generate-notes
          --title "Inttegro Java SDK ${GITHUB_REF_NAME}"
          --verify-tag
